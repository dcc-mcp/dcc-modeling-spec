name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "dcc-mcp-core==0.20.11" pytest ruff
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Skill contract
        run: >-
          python -c "from dcc_mcp_core import validate_skill;
          r=validate_skill('skill/modeling-spec'); print(r);
          raise SystemExit(1 if r.has_errors else 0)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Check Python
        run: |
          python -m ruff check skill tests
          python -m ruff format --check skill tests
